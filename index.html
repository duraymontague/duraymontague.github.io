<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Duray Montague – Coming Soon</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Georgia', 'Times New Roman', serif;
    }
    
    body {
      background-image: 
        /* Light parchment texture overlay */
        url('https://www.transparenttextures.com/patterns/cream-paper.png'),
        /* Warm aged-paper background color gradient */
        linear-gradient(to bottom right, #f5e8c7, #e8d9b8);
      background-size: cover;
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .container {
      background-color: rgba(255, 255, 255, 0.94);
      padding: 3.5rem 4rem;
      max-width: 680px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.22);
      border: 1px solid #d4b37f;
      border-radius: 7px;
    }
    
    h1 {
      color: #1a0f08;
      font-size: 3.4rem;
      margin: 0 0 1rem;
      letter-spacing: 1.5px;
    }
    
    p {
      color: #2e1a0f;
      font-size: 1.45rem;
      line-height: 1.6;
      margin: 0.4rem 0;
    }
    
    .subtitle {
      font-size: 1.6rem;
      font-style: italic;
      color: #4a3325;
      margin-top: 1.6rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>duraymontague.com</h1>
    <p>Under Construction</p>
    <p class="subtitle">Coming soon – more to be revealed shortly</p>
  </div>
</body>
</html>
